<script>
const video = document.getElementById('tvVideo');
const canvas = document.getElementById('noiseCanvas');
const ctx = canvas.getContext('2d');
const knob = document.getElementById('knobPlay');
const indicator = document.getElementById('tvIndicator');

let audioCtx;

/* ── CLICK SOUND ── */
function clickSound(freq) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.frequency.value = freq;
  osc.type = "square";

  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

/* ── HUM ── */
function startHum() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.frequency.value = 60;
  gain.gain.value = 0.02;

  osc.connect(gain).connect(audioCtx.destination);
  osc.start();

  video._hum = osc;
}

function stopHum() {
  if (video._hum) video._hum.stop();
}

/* ── CRT BOOT ── */
function crtBoot() {
  let i = 0;

  const flicker = setInterval(() => {
    canvas.style.opacity = i % 2 ? "0.2" : "1";
    i++;

    if (i > 6) {
      clearInterval(flicker);
      canvas.style.opacity = "0";
      startVideo();
    }
  }, 60);
}

/* ── VHS GLITCH ── */
function glitch() {
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      const y = Math.random() * canvas.height;
      const h = Math.random() * 20;

      ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.3})`;
      ctx.fillRect(0, y, canvas.width, h);
    }, i * 30);
  }
}

/* ── PLAY VIDEO ── */
function startVideo() {
  video.style.display = "block";
  video.currentTime = 0;

  video.play().then(() => {
    startHum();
    glitch();
  }).catch(() => {
    canvas.style.opacity = "1";
    video.style.display = "none";
    knob.classList.remove("playing");
  });
}

/* ── TOGGLE ── */
knob.addEventListener("click", () => {

  if (knob.classList.contains("playing")) {
    clickSound(120);

    video.pause();
    video.currentTime = 0;
    video.style.display = "none";

    stopHum();

    canvas.style.opacity = "1";
    knob.classList.remove("playing");

    indicator.style.background = "";
    indicator.style.boxShadow = "";

  } else {
    clickSound(220);

    knob.classList.add("playing");

    indicator.style.background = "#d03030";
    indicator.style.boxShadow = "0 0 8px #d03030";

    crtBoot();
  }

});

/* ── NOISE ── */
function noise() {
  const imageData = ctx.createImageData(canvas.width, canvas.height);
  const data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random() * 255;
    data[i] = data[i+1] = data[i+2] = v;
    data[i+3] = 255;
  }

  ctx.putImageData(imageData, 0, 0);
  requestAnimationFrame(noise);
}
noise();

/* ── NAV ── */
window.addEventListener('scroll', () => {
  document.getElementById('mainNav')
    .classList.toggle('scrolled', window.scrollY > 60);
});
</script>
